name: ChineseScript M1 Linux Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ChineseScript_M1_Godot44/**"
      - "ChineseScript_M1_Godot44.zip"
      - ".github/workflows/build-chinese-script.yml"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip

      - name: Extract source archive if present
        shell: bash
        run: |
          if [[ -f ChineseScript_M1_Godot44.zip && ! -d ChineseScript_M1_Godot44 ]]; then
            unzip -q ChineseScript_M1_Godot44.zip
          fi

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [[ -f CMakeLists.txt ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ChineseScript_M1_Godot44/CMakeLists.txt ]]; then
            echo "dir=ChineseScript_M1_Godot44" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing source. Add ChineseScript_M1_Godot44.zip to the repository root or commit the extracted project folder."
            exit 1
          fi

      - name: Fix ScriptLanguageExtension typed array signatures
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # Godot 4.4 ScriptExtension returns TypedArray<Dictionary>, not Array<Dictionary>.
          grep -RIl 'Array<Dictionary>' src --include='*.h' --include='*.cpp' | while read -r file; do
            sed -i 's/Array<Dictionary>/TypedArray<Dictionary>/g' "$file"
          done

      - name: Add missing PackedStringArray include
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # string.hpp only forward-declares PackedStringArray; this translation unit instantiates it.
          sed -i '1i #include <godot_cpp/variant/packed_string_array.hpp>' src/frontend/m1_parser.cpp

      - name: Implement required ScriptLanguageExtension virtual
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path("src/language/chinese_language.h")
          if not header.exists():
              raise SystemExit(f"Missing language header: {header}")
          source = header.read_text(encoding="utf-8")
          class_pattern = re.compile(
              r"(class\s+ChineseLanguage\s*:\s*public\s+(?:godot::)?ScriptLanguageExtension\s*\{)"
          )
          match = class_pattern.search(source)
          if not match:
              raise SystemExit("Could not locate ChineseLanguage : public ScriptLanguageExtension")
          class_start = match.end()
          depth = 1
          i = class_start
          while i < len(source) and depth:
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
              i += 1
          if depth:
              raise SystemExit("Unbalanced ChineseLanguage class braces")
          class_body = source[class_start:i - 1]
          additions = []
          changed = False
          if "_reload_all_scripts" not in class_body:
              additions.append("    void _reload_all_scripts() override {}")
          if "_handles_global_class_type" not in class_body:
              additions.append("    bool _handles_global_class_type(const String &type) const override { return false; }")

          bind_reload = "GDVIRTUAL_BIND(_reload_all_scripts);"
          bind_global_type = 'GDVIRTUAL_BIND(_handles_global_class_type, "type");'
          bind_lines = []
          if bind_reload not in class_body:
              bind_lines.append(bind_reload)
          if bind_global_type not in class_body:
              bind_lines.append(bind_global_type)

          bind_block = (
              "    static void _bind_methods() {\n"
              + "".join("        " + line + "\n" for line in bind_lines)
              + "    }"
          )

          # Register these virtual callbacks with Godot's GDExtension resolver.
          bind_decl = re.search(r"static\s+void\s+_bind_methods\s*\(\s*\)\s*;", class_body)
          bind_def = re.search(r"static\s+void\s+_bind_methods\s*\(\s*\)\s*\{", class_body)
          if bind_decl and bind_lines:
              a, b = bind_decl.span()
              class_body = class_body[:a] + bind_block + class_body[b:]
              changed = True
          elif bind_def and bind_lines:
              open_brace = class_body.find("{", bind_def.start())
              class_body = class_body[:open_brace + 1] + (
                  "\n" + "".join("        " + line + "\n" for line in bind_lines)
              ) + class_body[open_brace + 1:]
              changed = True
          elif not bind_decl and not bind_def and bind_lines:
              additions.append(bind_block)

          if additions:
              class_body = "\npublic:\n" + "\n".join(additions) + "\n" + class_body
              changed = True

          if changed:
              source = source[:class_start] + class_body + source[i - 1:]
              header.write_text(source, encoding="utf-8", newline="\n")
              print("Added and registered required ScriptLanguageExtension virtuals")
          else:
              print("Required ScriptLanguageExtension virtuals already present")
          PY

      - name: Fetch latest godot-cpp (master)
        working-directory: ${{ steps.project.outputs.dir }}
        run: git clone --depth 1 --branch master https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Adapt RefCounted script factory return
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # New godot-cpp returns Ref<T> from memnew() for RefCounted classes.
          sed -i 's/return memnew(ChineseScript);/return memnew(ChineseScript).ptr();/' src/language/chinese_language.cpp

      - name: Configure
        working-directory: ${{ steps.project.outputs.dir }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGODOTCPP_API_VERSION=4.7

      - name: Compile
        working-directory: ${{ steps.project.outputs.dir }}
        run: set -o pipefail && cmake --build build --parallel 2>&1 | tee build.log

      - name: Package build output
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          if [[ -f "$PROJECT_DIR/addons/chinese_script_language/bin/libchinese_script.so" ]]; then
            cp "$PROJECT_DIR/addons/chinese_script_language/bin/libchinese_script.so" dist/
          fi
          if [[ -f "$PROJECT_DIR/build.log" ]]; then
            cp "$PROJECT_DIR/build.log" dist/
          fi
          if [[ -f "$PROJECT_DIR/build/CMakeCache.txt" ]]; then
            cp "$PROJECT_DIR/build/CMakeCache.txt" dist/
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChineseScript-M1-Linux-x86_64
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip file

      - name: Extract source archive if present
        shell: bash
        run: |
          if [[ -f ChineseScript_M1_Godot44.zip && ! -d ChineseScript_M1_Godot44 ]]; then
            unzip -q ChineseScript_M1_Godot44.zip
          fi

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [[ -f CMakeLists.txt ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ChineseScript_M1_Godot44/CMakeLists.txt ]]; then
            echo "dir=ChineseScript_M1_Godot44" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing ChineseScript M1 source archive or project folder."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Implement required ScriptLanguageExtension virtual
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path("src/language/chinese_language.h")
          if not header.exists():
              raise SystemExit(f"Missing language header: {header}")
          source = header.read_text(encoding="utf-8")
          class_pattern = re.compile(
              r"(class\s+ChineseLanguage\s*:\s*public\s+(?:godot::)?ScriptLanguageExtension\s*\{)"
          )
          match = class_pattern.search(source)
          if not match:
              raise SystemExit("Could not locate ChineseLanguage : public ScriptLanguageExtension")
          class_start = match.end()
          depth = 1
          i = class_start
          while i < len(source) and depth:
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
              i += 1
          if depth:
              raise SystemExit("Unbalanced ChineseLanguage class braces")
          class_body = source[class_start:i - 1]
          additions = []
          changed = False
          if "_reload_all_scripts" not in class_body:
              additions.append("    void _reload_all_scripts() override {}")
          if "_handles_global_class_type" not in class_body:
              additions.append("    bool _handles_global_class_type(const String &type) const override { return false; }")

          bind_reload = "GDVIRTUAL_BIND(_reload_all_scripts);"
          bind_global_type = 'GDVIRTUAL_BIND(_handles_global_class_type, "type");'
          bind_lines = []
          if bind_reload not in class_body:
              bind_lines.append(bind_reload)
          if bind_global_type not in class_body:
              bind_lines.append(bind_global_type)

          bind_block = (
              "    static void _bind_methods() {\n"
              + "".join("        " + line + "\n" for line in bind_lines)
              + "    }"
          )

          # Register these virtual callbacks with Godot's GDExtension resolver.
          bind_decl = re.search(r"static\s+void\s+_bind_methods\s*\(\s*\)\s*;", class_body)
          bind_def = re.search(r"static\s+void\s+_bind_methods\s*\(\s*\)\s*\{", class_body)
          if bind_decl and bind_lines:
              a, b = bind_decl.span()
              class_body = class_body[:a] + bind_block + class_body[b:]
              changed = True
          elif bind_def and bind_lines:
              open_brace = class_body.find("{", bind_def.start())
              class_body = class_body[:open_brace + 1] + (
                  "\n" + "".join("        " + line + "\n" for line in bind_lines)
              ) + class_body[open_brace + 1:]
              changed = True
          elif not bind_decl and not bind_def and bind_lines:
              additions.append(bind_block)

          if additions:
              class_body = "\npublic:\n" + "\n".join(additions) + "\n" + class_body
              changed = True

          if changed:
              source = source[:class_start] + class_body + source[i - 1:]
              header.write_text(source, encoding="utf-8", newline="\n")
              print("Added and registered required ScriptLanguageExtension virtuals")
          else:
              print("Required ScriptLanguageExtension virtuals already present")
          PY

      - name: Fetch latest godot-cpp (master)
        working-directory: ${{ steps.project.outputs.dir }}
        run: git clone --depth 1 --branch master https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Fix ScriptLanguageExtension typed array signatures
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          grep -RIl 'Array<Dictionary>' src --include='*.h' --include='*.cpp' | while read -r file; do
            sed -i 's/Array<Dictionary>/TypedArray<Dictionary>/g' "$file"
          done

      - name: Add missing PackedStringArray include
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if ! grep -q 'godot_cpp/variant/packed_string_array.hpp' src/frontend/m1_parser.cpp; then
            sed -i '1i #include <godot_cpp/variant/packed_string_array.hpp>' src/frontend/m1_parser.cpp
          fi

      - name: Adapt RefCounted script factory return
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # New godot-cpp returns Ref<T> from memnew() for RefCounted classes.
          sed -i 's/return memnew(ChineseScript);/return memnew(ChineseScript).ptr();/' src/language/chinese_language.cpp

      - name: Configure Android ARM64
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGODOTCPP_TARGET=template_debug \
            -DGODOTCPP_API_VERSION=4.7

      - name: Compile Android ARM64
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: set -o pipefail && cmake --build build-android --parallel 2>&1 | tee build-android.log

      - name: Add Android entries to GDExtension manifest
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("addons/chinese_script_language/chinese_script.gdextension")
          if not p.exists():
              raise SystemExit(f"Missing GDExtension manifest: {p}")
          s = p.read_text(encoding="utf-8")
          entries = (
              'android.debug.arm64 = "res://addons/chinese_script_language/bin/libchinese_script.so"',
          )
          if "[libraries]" not in s:
              raise SystemExit("GDExtension manifest has no [libraries] section")
          head, tail = s.split("[libraries]", 1)
          for entry in entries:
              key = entry.split(" = ", 1)[0]
              lines = [line.strip() for line in tail.splitlines()]
              if key not in [line.split(" = ", 1)[0] for line in lines if " = " in line]:
                  tail = entry + "\n" + tail.lstrip("\n")
          p.write_text(head + "[libraries]\n" + tail.lstrip("\n"), encoding="utf-8", newline="\n")
          PY

      - name: Package Android build output
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          mkdir -p dist-android
          if [[ -d addons/chinese_script_language ]]; then
            mkdir -p dist-android/addons
            cp -a addons/chinese_script_language dist-android/addons/
          fi
          if [[ -f addons/chinese_script_language/bin/libchinese_script.so ]]; then
            file addons/chinese_script_language/bin/libchinese_script.so | tee dist-android/binary-info.txt
            readelf -h addons/chinese_script_language/bin/libchinese_script.so >> dist-android/binary-info.txt
          fi
          if [[ -f build-android.log ]]; then cp build-android.log dist-android/; fi
          if [[ -f build-android/CMakeCache.txt ]]; then cp build-android/CMakeCache.txt dist-android/; fi

      - name: Upload Android ARM64 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChineseScript-M1-Android-arm64-v8a
          path: ${{ steps.project.outputs.dir }}/dist-android/
          if-no-files-found: warn
          retention-days: 14
