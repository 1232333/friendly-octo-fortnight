name: ChineseScript M1 Linux Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ChineseScript_M1_Godot44/**"
      - "ChineseScript_M1_Godot44.zip"
      - ".github/workflows/build-chinese-script.yml"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip

      - name: Extract source archive if present
        shell: bash
        run: |
          if [[ -f ChineseScript_M1_Godot44.zip && ! -d ChineseScript_M1_Godot44 ]]; then
            unzip -q ChineseScript_M1_Godot44.zip
          fi

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [[ -f CMakeLists.txt ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ChineseScript_M1_Godot44/CMakeLists.txt ]]; then
            echo "dir=ChineseScript_M1_Godot44" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing source. Add ChineseScript_M1_Godot44.zip to the repository root or commit the extracted project folder."
            exit 1
          fi

      - name: Resolve Godot 4.7 virtual method hashes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("godot-cpp/gen/src/classes"), Path("godot-cpp/src/classes")]
          files = [p for root in roots if root.exists() for p in root.rglob("*script_language_extension*.cpp")]
          if not files:
              raise SystemExit("Could not find generated ScriptLanguageExtension C++ binding")
          text = "\n".join(p.read_text(encoding="utf-8") for p in files)
          def get_hash(method):
              pattern = rf"BIND_VIRTUAL_METHOD\(ScriptLanguageExtension,\s*{re.escape(method)},\s*(0x[0-9A-Fa-f]+|[0-9]+)\s*\)"
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"Could not find Godot API hash for {method}")
              return match.group(1)

          source = Path("src/language/chinese_language.cpp")
          cpp = source.read_text(encoding="utf-8")
          cpp = cpp.replace("__HASH_RELOAD__", get_hash("_reload_all_scripts"))
          cpp = cpp.replace("__HASH_TYPE__", get_hash("_handles_global_class_type"))
          if "__HASH_" in cpp:
              raise SystemExit("Unresolved virtual method hash placeholder")
          source.write_text(cpp, encoding="utf-8", newline="\n")
          print("Resolved native virtual method hashes from godot-cpp generated bindings")
          PY

      - name: Fix ScriptLanguageExtension typed array signatures
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # Godot 4.4 ScriptExtension returns TypedArray<Dictionary>, not Array<Dictionary>.
          grep -RIl 'Array<Dictionary>' src --include='*.h' --include='*.cpp' | while read -r file; do
            sed -i 's/Array<Dictionary>/TypedArray<Dictionary>/g' "$file"
          done

      - name: Add missing PackedStringArray include
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # string.hpp only forward-declares PackedStringArray; this translation unit instantiates it.
          sed -i '1i #include <godot_cpp/variant/packed_string_array.hpp>' src/frontend/m1_parser.cpp

      - name: Implement required ScriptLanguageExtension virtuals
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path("src/language/chinese_language.h")
          source_cpp = Path("src/language/chinese_language.cpp")
          if not header.exists() or not source_cpp.exists():
              raise SystemExit("Missing ChineseLanguage header or source")

          h = header.read_text(encoding="utf-8")
          include = "#include <godot_cpp/core/gdvirtual.gen.inc>"
          if include not in h:
              lines = h.splitlines()
              insert_at = 1 if lines and lines[0].startswith("#pragma once") else 0
              lines.insert(insert_at, include)
              h = "\n".join(lines) + "\n"

          # Remove all previous binding statements from the class header.
          # GDVIRTUAL_BIND belongs in the out-of-line _bind_methods() implementation,
          # never directly in the class declaration.
          h = re.sub(r"^\s*GDVIRTUAL_BIND\([^\n]*\);\s*\n", "", h, flags=re.M)
          h = re.sub(
              r"static\s+void\s+_bind_methods\s*\(\s*\)\s*\{[^}]*\}",
              "",
              h,
              flags=re.S,
          )
          h = re.sub(r"^\s*void _reload_all_scripts\(\) override \{\}\s*\n", "", h, flags=re.M)
          h = re.sub(r"^\s*bool _handles_global_class_type\(const String &type\) const override \{ return false; \}\s*\n", "", h, flags=re.M)

          declarations = [
              "    GDVIRTUAL0(_reload_all_scripts);",
              "    GDVIRTUAL1RC(bool, _handles_global_class_type, const String &);",
              "    void _reload_all_scripts();",
              "    bool _handles_global_class_type(const String &type) const;",
          ]
          for declaration in declarations:
              if declaration.strip() not in h:
                  pos = h.rfind("};")
                  if pos < 0:
                      raise SystemExit("Could not find end of ChineseLanguage class")
                  h = h[:pos] + "\n" + declaration + "\n" + h[pos:]

          cpp = source_cpp.read_text(encoding="utf-8")
          bind_reload = "BIND_VIRTUAL_METHOD(ChineseLanguage, _reload_all_scripts, __HASH_RELOAD__);"
          bind_type = "BIND_VIRTUAL_METHOD(ChineseLanguage, _handles_global_class_type, __HASH_TYPE__);"
          match = re.search(r"void\s+ChineseLanguage::_bind_methods\s*\(\s*\)\s*\{", cpp)
          if not match:
              raise SystemExit("Could not find ChineseLanguage::_bind_methods() in source")
          brace = cpp.find("{", match.start()) + 1
          # Remove the earlier GDVIRTUAL_BIND-only registrations: they declare metadata,
          # but do not install the native GDExtension callback implementation.
          cpp = re.sub(r"^\s*GDVIRTUAL_BIND\([^\n]*\);\s*\n", "", cpp, flags=re.M)
          match = re.search(r"void\s+ChineseLanguage::_bind_methods\s*\(\s*\)\s*\{", cpp)
          brace = cpp.find("{", match.start()) + 1
          insertions = []
          if bind_reload not in cpp:
              insertions.append("    " + bind_reload)
          if bind_type not in cpp:
              insertions.append("    " + bind_type)
          if insertions:
              cpp = cpp[:brace] + "\n" + "\n".join(insertions) + cpp[brace:]

          if "void ChineseLanguage::_reload_all_scripts()" not in cpp:
              definitions = "\n\nvoid ChineseLanguage::_reload_all_scripts() {\n}\n\nbool ChineseLanguage::_handles_global_class_type(const String &type) const {\n    return false;\n}\n"
              namespace_end = cpp.rfind("} // namespace godot")
              if namespace_end < 0:
                  raise SystemExit("Could not find closing godot namespace in chinese_language.cpp")
              cpp = cpp[:namespace_end] + definitions + cpp[namespace_end:]

          header.write_text(h, encoding="utf-8", newline="\n")
          source_cpp.write_text(cpp, encoding="utf-8", newline="\n")
          print("Registered native ScriptLanguageExtension virtual callbacks with BIND_VIRTUAL_METHOD")
          PY

      - name: Fetch latest godot-cpp (master)
        working-directory: ${{ steps.project.outputs.dir }}
        run: git clone --depth 1 --branch master https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Adapt RefCounted script factory return
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # New godot-cpp returns Ref<T> from memnew() for RefCounted classes.
          sed -i 's/return memnew(ChineseScript);/return memnew(ChineseScript).ptr();/' src/language/chinese_language.cpp

      - name: Configure
        working-directory: ${{ steps.project.outputs.dir }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGODOTCPP_API_VERSION=4.7

      - name: Compile
        working-directory: ${{ steps.project.outputs.dir }}
        run: set -o pipefail && cmake --build build --parallel 2>&1 | tee build.log

      - name: Package build output
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          if [[ -f "$PROJECT_DIR/addons/chinese_script_language/bin/libchinese_script.so" ]]; then
            cp "$PROJECT_DIR/addons/chinese_script_language/bin/libchinese_script.so" dist/
          fi
          if [[ -f "$PROJECT_DIR/build.log" ]]; then
            cp "$PROJECT_DIR/build.log" dist/
          fi
          if [[ -f "$PROJECT_DIR/build/CMakeCache.txt" ]]; then
            cp "$PROJECT_DIR/build/CMakeCache.txt" dist/
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChineseScript-M1-Linux-x86_64
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip file

      - name: Extract source archive if present
        shell: bash
        run: |
          if [[ -f ChineseScript_M1_Godot44.zip && ! -d ChineseScript_M1_Godot44 ]]; then
            unzip -q ChineseScript_M1_Godot44.zip
          fi

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [[ -f CMakeLists.txt ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ChineseScript_M1_Godot44/CMakeLists.txt ]]; then
            echo "dir=ChineseScript_M1_Godot44" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing ChineseScript M1 source archive or project folder."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Implement required ScriptLanguageExtension virtuals
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path("src/language/chinese_language.h")
          source_cpp = Path("src/language/chinese_language.cpp")
          if not header.exists() or not source_cpp.exists():
              raise SystemExit("Missing ChineseLanguage header or source")

          h = header.read_text(encoding="utf-8")
          include = "#include <godot_cpp/core/gdvirtual.gen.inc>"
          if include not in h:
              lines = h.splitlines()
              insert_at = 1 if lines and lines[0].startswith("#pragma once") else 0
              lines.insert(insert_at, include)
              h = "\n".join(lines) + "\n"

          # Remove the incorrect C++ override / inline binding patch from earlier builds, if present.
          h = re.sub(r"^\s*void _reload_all_scripts\(\) override \{\}\s*\n", "", h, flags=re.M)
          h = re.sub(r"^\s*bool _handles_global_class_type\(const String &type\) const override \{ return false; \}\s*\n", "", h, flags=re.M)
          h = re.sub(
              r"^\s*static void _bind_methods\(\)\s*\{\s*GDVIRTUAL_BIND\(_reload_all_scripts\);\s*GDVIRTUAL_BIND\(_handles_global_class_type, \"type\"\);\s*\}\s*\n",
              "",
              h,
              flags=re.M,
          )

          declarations = [
              "    GDVIRTUAL0(_reload_all_scripts);",
              "    GDVIRTUAL1RC(bool, _handles_global_class_type, const String &);",
              "    void _reload_all_scripts();",
              "    bool _handles_global_class_type(const String &type) const;",
          ]
          for declaration in declarations:
              if declaration.strip() not in h:
                  pos = h.rfind("};")
                  if pos < 0:
                      raise SystemExit("Could not find end of ChineseLanguage class")
                  h = h[:pos] + "\n" + declaration + "\n" + h[pos:]

          cpp = source_cpp.read_text(encoding="utf-8")
          bind_reload = "BIND_VIRTUAL_METHOD(ChineseLanguage, _reload_all_scripts, __HASH_RELOAD__);"
          bind_type = "BIND_VIRTUAL_METHOD(ChineseLanguage, _handles_global_class_type, __HASH_TYPE__);"
          match = re.search(r"void\s+ChineseLanguage::_bind_methods\s*\(\s*\)\s*\{", cpp)
          if not match:
              raise SystemExit("Could not find ChineseLanguage::_bind_methods() in source")
          brace = cpp.find("{", match.start()) + 1
          # Remove the earlier GDVIRTUAL_BIND-only registrations: they declare metadata,
          # but do not install the native GDExtension callback implementation.
          cpp = re.sub(r"^\s*GDVIRTUAL_BIND\([^\n]*\);\s*\n", "", cpp, flags=re.M)
          match = re.search(r"void\s+ChineseLanguage::_bind_methods\s*\(\s*\)\s*\{", cpp)
          brace = cpp.find("{", match.start()) + 1
          insertions = []
          if bind_reload not in cpp:
              insertions.append("    " + bind_reload)
          if bind_type not in cpp:
              insertions.append("    " + bind_type)
          if insertions:
              cpp = cpp[:brace] + "\n" + "\n".join(insertions) + cpp[brace:]

          if "void ChineseLanguage::_reload_all_scripts()" not in cpp:
              definitions = "\n\nvoid ChineseLanguage::_reload_all_scripts() {\n}\n\nbool ChineseLanguage::_handles_global_class_type(const String &type) const {\n    return false;\n}\n"
              namespace_end = cpp.rfind("} // namespace godot")
              if namespace_end < 0:
                  raise SystemExit("Could not find closing godot namespace in chinese_language.cpp")
              cpp = cpp[:namespace_end] + definitions + cpp[namespace_end:]

          header.write_text(h, encoding="utf-8", newline="\n")
          source_cpp.write_text(cpp, encoding="utf-8", newline="\n")
          print("Registered native ScriptLanguageExtension virtual callbacks with BIND_VIRTUAL_METHOD")
          PY

      - name: Fetch latest godot-cpp (master)
        working-directory: ${{ steps.project.outputs.dir }}
        run: git clone --depth 1 --branch master https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Resolve Godot 4.7 virtual method hashes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("godot-cpp/gen/src/classes"), Path("godot-cpp/src/classes")]
          files = [p for root in roots if root.exists() for p in root.rglob("*script_language_extension*.cpp")]
          if not files:
              raise SystemExit("Could not find generated ScriptLanguageExtension C++ binding")
          text = "\n".join(p.read_text(encoding="utf-8") for p in files)
          def get_hash(method):
              pattern = rf"BIND_VIRTUAL_METHOD\(ScriptLanguageExtension,\s*{re.escape(method)},\s*(0x[0-9A-Fa-f]+|[0-9]+)\s*\)"
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"Could not find Godot API hash for {method}")
              return match.group(1)

          source = Path("src/language/chinese_language.cpp")
          cpp = source.read_text(encoding="utf-8")
          cpp = cpp.replace("__HASH_RELOAD__", get_hash("_reload_all_scripts"))
          cpp = cpp.replace("__HASH_TYPE__", get_hash("_handles_global_class_type"))
          if "__HASH_" in cpp:
              raise SystemExit("Unresolved virtual method hash placeholder")
          source.write_text(cpp, encoding="utf-8", newline="\n")
          print("Resolved native virtual method hashes from godot-cpp generated bindings")
          PY

      - name: Fix ScriptLanguageExtension typed array signatures
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          grep -RIl 'Array<Dictionary>' src --include='*.h' --include='*.cpp' | while read -r file; do
            sed -i 's/Array<Dictionary>/TypedArray<Dictionary>/g' "$file"
          done

      - name: Add missing PackedStringArray include
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if ! grep -q 'godot_cpp/variant/packed_string_array.hpp' src/frontend/m1_parser.cpp; then
            sed -i '1i #include <godot_cpp/variant/packed_string_array.hpp>' src/frontend/m1_parser.cpp
          fi

      - name: Adapt RefCounted script factory return
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # New godot-cpp returns Ref<T> from memnew() for RefCounted classes.
          sed -i 's/return memnew(ChineseScript);/return memnew(ChineseScript).ptr();/' src/language/chinese_language.cpp

      - name: Configure Android ARM64
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGODOTCPP_TARGET=template_debug \
            -DGODOTCPP_API_VERSION=4.7

      - name: Compile Android ARM64
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: set -o pipefail && cmake --build build-android --parallel 2>&1 | tee build-android.log

      - name: Add Android entries to GDExtension manifest
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("addons/chinese_script_language/chinese_script.gdextension")
          if not p.exists():
              raise SystemExit(f"Missing GDExtension manifest: {p}")
          s = p.read_text(encoding="utf-8")
          entries = (
              'android.debug.arm64 = "res://addons/chinese_script_language/bin/libchinese_script.so"',
          )
          if "[libraries]" not in s:
              raise SystemExit("GDExtension manifest has no [libraries] section")
          head, tail = s.split("[libraries]", 1)
          for entry in entries:
              key = entry.split(" = ", 1)[0]
              lines = [line.strip() for line in tail.splitlines()]
              if key not in [line.split(" = ", 1)[0] for line in lines if " = " in line]:
                  tail = entry + "\n" + tail.lstrip("\n")
          p.write_text(head + "[libraries]\n" + tail.lstrip("\n"), encoding="utf-8", newline="\n")
          PY

      - name: Package Android build output
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          mkdir -p dist-android
          if [[ -d addons/chinese_script_language ]]; then
            mkdir -p dist-android/addons
            cp -a addons/chinese_script_language dist-android/addons/
          fi
          if [[ -f addons/chinese_script_language/bin/libchinese_script.so ]]; then
            file addons/chinese_script_language/bin/libchinese_script.so | tee dist-android/binary-info.txt
            readelf -h addons/chinese_script_language/bin/libchinese_script.so >> dist-android/binary-info.txt
          fi
          if [[ -f build-android.log ]]; then cp build-android.log dist-android/; fi
          if [[ -f build-android/CMakeCache.txt ]]; then cp build-android/CMakeCache.txt dist-android/; fi

      - name: Upload Android ARM64 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChineseScript-M1-Android-arm64-v8a
          path: ${{ steps.project.outputs.dir }}/dist-android/
          if-no-files-found: warn
          retention-days: 14
