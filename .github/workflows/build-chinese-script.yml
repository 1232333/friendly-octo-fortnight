name: ChineseScript M1 Linux Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ChineseScript_M1_Godot44/**"
      - "ChineseScript_M1_Godot44.zip"
      - ".github/workflows/build-chinese-script.yml"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip

      - name: Extract source archive if present
        shell: bash
        run: |
          if [[ -f ChineseScript_M1_Godot44.zip && ! -d ChineseScript_M1_Godot44 ]]; then
            unzip -q ChineseScript_M1_Godot44.zip
          fi

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [[ -f CMakeLists.txt ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ChineseScript_M1_Godot44/CMakeLists.txt ]]; then
            echo "dir=ChineseScript_M1_Godot44" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing source. Add ChineseScript_M1_Godot44.zip to the repository root or commit the extracted project folder."
            exit 1
          fi

      - name: Fix Godot 4.4 typed array signatures
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # Godot 4.4 ScriptExtension returns TypedArray<Dictionary>, not Array<Dictionary>.
          grep -RIl 'Array<Dictionary>' src --include='*.h' --include='*.cpp' | while read -r file; do
            sed -i 's/Array<Dictionary>/TypedArray<Dictionary>/g' "$file"
          done

      - name: Add missing PackedStringArray include
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # string.hpp only forward-declares PackedStringArray; this translation unit instantiates it.
          sed -i '1i #include <godot_cpp/variant/packed_string_array.hpp>' src/frontend/m1_parser.cpp

      - name: Fetch godot-cpp 4.4
        working-directory: ${{ steps.project.outputs.dir }}
        run: git clone --depth 1 --branch 4.4 https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Configure
        working-directory: ${{ steps.project.outputs.dir }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Compile
        working-directory: ${{ steps.project.outputs.dir }}
        run: set -o pipefail && cmake --build build --parallel 2>&1 | tee build.log

      - name: Package build output
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          if [[ -f "$PROJECT_DIR/addons/chinese_script_language/bin/libchinese_script.so" ]]; then
            cp "$PROJECT_DIR/addons/chinese_script_language/bin/libchinese_script.so" dist/
          fi
          if [[ -f "$PROJECT_DIR/build.log" ]]; then
            cp "$PROJECT_DIR/build.log" dist/
          fi
          if [[ -f "$PROJECT_DIR/build/CMakeCache.txt" ]]; then
            cp "$PROJECT_DIR/build/CMakeCache.txt" dist/
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChineseScript-M1-Linux-x86_64
          path: dist/
          if-no-files-found: warn
          retention-days: 14
