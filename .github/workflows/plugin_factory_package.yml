name: Plugin Factory Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - plugin-factory-bootstrap
    paths:
      - "addons/plugin_factory/**"
      - "tests/validate_plugin_factory.gd"
      - "tests/test_termux_builder.py"
      - "tools/termux_cpp_builder/**"
      - ".github/workflows/plugin_factory_package.yml"

permissions:
  contents: read

concurrency:
  group: plugin-factory-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate addon structure and feature markers
        shell: bash
        run: |
          set -euo pipefail
          test -s addons/plugin_factory/plugin.cfg
          test -s addons/plugin_factory/plugin.gd
          test -s addons/plugin_factory/importer.gd
          test -s tools/termux_cpp_builder/server.py
          test -s addons/plugin_factory/templates/cpp_extension/CMakeLists.txt
          test -s addons/plugin_factory/templates/cpp_extension/src/register_types.cpp\n          test -s addons/plugin_factory/templates/cpp_extension/src/chinese_compiler.cpp\n          test -s addons/plugin_factory/templates/cpp_extension/src/chinese_language_binding.cpp\n          test -s tests/chinese_compiler_test.cpp
          test -s addons/plugin_factory/templates/cpp_extension/chinese_native.gdextension.template
          grep -Fq '[plugin]' addons/plugin_factory/plugin.cfg
          grep -q '^@tool' addons/plugin_factory/plugin.gd
          grep -q 'FACTORY_VERSION := "0.4.0"' addons/plugin_factory/plugin.gd
          grep -q '_visit_dependency' addons/plugin_factory/plugin.gd
          grep -q '_resolve_selection' addons/plugin_factory/plugin.gd
          grep -q '_save_profile' addons/plugin_factory/plugin.gd
          grep -q '_load_profile' addons/plugin_factory/plugin.gd
          grep -q 'ZIPPacker' addons/plugin_factory/plugin.gd
          grep -q 'import_zip' addons/plugin_factory/importer.gd
          grep -q 'import_folder' addons/plugin_factory/importer.gd
          grep -q 'ZIPReader' addons/plugin_factory/importer.gd
          grep -q '导入本地插件文件夹' addons/plugin_factory/plugin.gd
          grep -q '导入 ZIP 插件包' addons/plugin_factory/plugin.gd
          grep -q '编译 C++ 扩展' addons/plugin_factory/plugin.gd
          grep -q '打包整个项目 ZIP' addons/plugin_factory/plugin.gd
          python3 -m py_compile tools/termux_cpp_builder/server.py
          python3 -m unittest discover -s tests -p 'test_termux_builder.py'
          ! grep -q 'ZIPWriter' addons/plugin_factory/plugin.gd
          grep -q 'get_editor_main_screen' addons/plugin_factory/plugin.gd
          ! grep -q 'add_control_to_dock' addons/plugin_factory/plugin.gd
          test -s tests/validate_plugin_factory.gd
          echo "Plugin Factory 0.4.0 feature markers found."

      - name: Install Godot 4.7.2 headless
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse Plugin Factory with Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/validate_plugin_factory.gd

      - name: Test Chinese language compiler core
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I addons/plugin_factory/templates/cpp_extension/src \
            addons/plugin_factory/templates/cpp_extension/src/chinese_compiler.cpp \
            tests/chinese_compiler_test.cpp \
            -o /tmp/chinese_compiler_test
          /tmp/chinese_compiler_test

      - name: Build C++ GDExtension template on Linux CI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S addons/plugin_factory/templates/cpp_extension -B /tmp/chinese-native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/chinese-native-build --parallel 2
          test -s /tmp/chinese-native-build/output/libchinese_native.so

      - name: Create ZIP package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/PluginFactory-0.4.0-Godot-4.7.2.zip addons/plugin_factory tools/termux_cpp_builder
          unzip -t dist/PluginFactory-0.4.0-Godot-4.7.2.zip
          sha256sum dist/PluginFactory-0.4.0-Godot-4.7.2.zip | tee dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PluginFactory-0.4.0-Godot-4.7.2
          path: |
            dist/PluginFactory-0.4.0-Godot-4.7.2.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
