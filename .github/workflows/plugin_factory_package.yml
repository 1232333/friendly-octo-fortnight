name: Plugin Factory Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - plugin-factory-bootstrap
    paths:
      - "addons/plugin_factory/**"
      - "tests/validate_plugin_factory.gd"
      - ".github/workflows/plugin_factory_package.yml"

permissions:
  contents: read

concurrency:
  group: plugin-factory-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate addon structure and feature markers
        shell: bash
        run: |
          set -euo pipefail
          test -s addons/plugin_factory/plugin.cfg
          test -s addons/plugin_factory/plugin.gd
          grep -Fq '[plugin]' addons/plugin_factory/plugin.cfg
          grep -q '^@tool' addons/plugin_factory/plugin.gd
          grep -q 'FACTORY_VERSION := "0.3.0"' addons/plugin_factory/plugin.gd
          grep -q '_visit_dependency' addons/plugin_factory/plugin.gd
          grep -q '_resolve_selection' addons/plugin_factory/plugin.gd
          grep -q '_save_profile' addons/plugin_factory/plugin.gd
          grep -q '_load_profile' addons/plugin_factory/plugin.gd
          grep -q 'ZIPPacker' addons/plugin_factory/plugin.gd
          ! grep -q 'ZIPWriter' addons/plugin_factory/plugin.gd
          grep -q 'get_editor_main_screen' addons/plugin_factory/plugin.gd
          ! grep -q 'add_control_to_dock' addons/plugin_factory/plugin.gd
          test -s tests/validate_plugin_factory.gd
          echo "Plugin Factory 0.3.0 feature markers found."

      - name: Install Godot 4.7.2 headless
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse Plugin Factory with Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/validate_plugin_factory.gd

      - name: Create ZIP package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/PluginFactory-0.3.0-Godot-4.7.2.zip addons/plugin_factory
          unzip -t dist/PluginFactory-0.3.0-Godot-4.7.2.zip
          sha256sum dist/PluginFactory-0.3.0-Godot-4.7.2.zip | tee dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PluginFactory-0.3.0-Godot-4.7.2
          path: |
            dist/PluginFactory-0.3.0-Godot-4.7.2.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
