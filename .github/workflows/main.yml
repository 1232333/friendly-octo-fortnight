
name: Build Android ARM64 Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -eux
          ZIP_FILE="SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit.zip"
          test -f "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/source"

          ROOT="$(find "$RUNNER_TEMP/source" -type f -name ANDROID_ARM64_BUILD_CN.md -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "Cannot find extracted build package."
            find "$RUNNER_TEMP/source" -maxdepth 3 -type f
            exit 1
          fi

          rsync -a "$ROOT/" ./

      - name: Fetch Godot 4.7 source
        run: |
          set -eux
          mkdir -p extern
          git clone --depth 1 --branch 4.7 \
            https://github.com/godotengine/godot.git \
            extern/godot-engine

      - name: Fetch godot-cpp
        run: |
          set -eux
          git clone --depth 1 --branch 10.0.0-stable \
            https://github.com/godotengine/godot-cpp.git \
            extern/godot-cpp

      - name: Verify dependencies
        run: |
          test -f extern/godot-engine/CMakeLists.txt
          test -f extern/godot-cpp/CMakeLists.txt
          echo "Godot and godot-cpp sources are ready."

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            cmake \
            scons \
            python3 \
            python3-pip \
            rsync \
            unzip

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Build Android ARM64 Editor
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: android-arm64-editor
          cache-name: android-arm64-editor
          preset-name: android-arm64-editor

      - name: Verify compiled library
        shell: bash
        run: |
          LIB="project/addons/orchestrator/liborchestrator.android.64.editor.so"
          if [ ! -f "$LIB" ]; then
            echo "Android ARM64 editor library was not generated."
            find project/addons/orchestrator -maxdepth 2 -type f
            exit 1
          fi
          file "$LIB"
          ls -lh "$LIB"

      - name: Upload Android ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor
          path: project/addons/orchestrator/liborchestrator.android.64.editor.so
          if-no-files-found: error
