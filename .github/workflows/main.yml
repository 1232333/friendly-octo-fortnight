
name: Build Android ARM64 Editor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-android-arm64-editor:
    name: Build Android ARM64 Editor
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: 找不到源码 ZIP，请上传到仓库根目录。"
            ls -la
            exit 1
          fi

          TEMP_SOURCE="$RUNNER_TEMP/skill-tree-source"
          mkdir -p "$TEMP_SOURCE"
          unzip -q "$ZIP_FILE" -d "$TEMP_SOURCE"

          SOURCE_ROOT="$TEMP_SOURCE/SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit"

          if [ ! -f "$SOURCE_ROOT/CMakeLists.txt" ]; then
            echo "ERROR: ZIP 内没有找到 CMakeLists.txt"
            find "$TEMP_SOURCE" -maxdepth 4 -type f -name CMakeLists.txt -print
            exit 1
          fi

          rsync -a "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"

          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f .github/actions/orchestrator-build/action.yml

      
      - name: Fetch Godot dependencies
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p extern

          echo "Preparing Godot source..."
          rm -rf extern/godot-engine
          git clone --depth 1 --branch 4.7 \
            https://github.com/godotengine/godot.git \
            extern/godot-engine

          echo "Preparing godot-cpp source..."
          rm -rf extern/godot-cpp

          echo "Checking official repository..."
          git ls-remote https://github.com/godotengine/godot-cpp.git HEAD

          echo "Cloning godot-cpp master..."
          git clone --depth 1 --single-branch --branch master \
            https://github.com/godotengine/godot-cpp.git \
            extern/godot-cpp

          echo "Checking downloaded source..."
          test -f extern/godot-engine/CMakeLists.txt
          test -f extern/godot-cpp/CMakeLists.txt
          test -f extern/godot-cpp/SConstruct

          echo "Godot source:"
          git -C extern/godot-engine log -1 --oneline

          echo "godot-cpp source:"
          git -C extern/godot-cpp log -1 --oneline

          echo "Dependencies downloaded successfully."

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang ninja-build ccache rsync unzip file

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1
          scons --version

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_NDK=${ANDROID_NDK:-}"

          NDK_PATH="${ANDROID_NDK:-}"

          if [ -z "$NDK_PATH" ]; then
            echo "ERROR: Android NDK 环境变量未设置。"
            exit 1
          fi

          test -f "$NDK_PATH/build/cmake/android.toolchain.cmake"
          

      - name: Configure Godot API version
        shell: bash
        run: |
          set -euxo pipefail

          grep -n "GODOTCPP_API_VERSION" CMakeLists.txt

          cmake -S . -B build/android-arm64-editor \
            -G Ninja \
            -D GODOTCPP_API_VERSION=4.7

      - name: Build Android ARM64 Editor Extension
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: android-arm64-editor
          cache-name: android-arm64-editor
          preset-name: android-arm64-editor

      - name: Verify compiled Android library
        shell: bash
        run: |
          set -euo pipefail

          LIBRARY="project/addons/orchestrator/liborchestrator.android.64.editor.so"

          if [ ! -f "$LIBRARY" ]; then
            echo "ERROR: 没有找到目标文件：$LIBRARY"
            find project -type f -name '*.so' -print || true
            exit 1
          fi

          echo "Build successful:"
          ls -lh "$LIBRARY"
          file "$LIBRARY"

      - name: Upload Android ARM64 Editor library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor-Library
          path: project/addons/orchestrator/liborchestrator.android.64.editor.so
          if-no-files-found: error
          retention-days: 14
