
name: Build Android ARM64 Editor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-android-arm64-editor:
    name: Build Android ARM64 Editor
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit.zip"
          TEMP_SOURCE="$RUNNER_TEMP/skill-tree-source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::找不到构建包：$ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p "$TEMP_SOURCE"
          unzip -q "$ZIP_FILE" -d "$TEMP_SOURCE"

          SOURCE_ROOT="$TEMP_SOURCE/SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit"

          if [ ! -f "$SOURCE_ROOT/CMakeLists.txt" ]; then
            echo "::error::没有找到 CMakeLists.txt"
            find "$TEMP_SOURCE" -name CMakeLists.txt -print
            exit 1
          fi

          rsync -a "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"

          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f .github/actions/orchestrator-build/action.yml
          test -f src/script/script_rpc_callable.h

      - name: Fetch Godot dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extern

          echo "Fetching Godot Engine 4.7..."
          git clone --depth 1 --branch 4.7 \
            https://github.com/godotengine/godot.git \
            extern/godot-engine

          echo "Fetching godot-cpp..."
          git clone --depth 1 --branch master \
            https://github.com/godotengine/godot-cpp.git \
            extern/godot-cpp

          test -f extern/godot-engine/SConstruct
          test -f extern/godot-cpp/SConstruct

          echo "Godot:"
          git -C extern/godot-engine log -1 --oneline

          echo "godot-cpp:"
          git -C extern/godot-cpp log -1 --oneline

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang ninja-build ccache rsync unzip file

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1
          scons --version

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"

          if [ -z "$NDK_PATH" ]; then
            echo "::error::Android NDK 环境变量未设置"
            env | grep -i ndk || true
            exit 1
          fi

          test -f "$NDK_PATH/build/cmake/android.toolchain.cmake"

          echo "NDK: $NDK_PATH"

      # 修复本次 99% 编译失败的 StringName 类型错误
      - name: Patch StringName include
        shell: bash
        run: |
          set -euo pipefail

          HEADER="src/script/script_rpc_callable.h"
          INCLUDE="#include <godot_cpp/variant/string_name.hpp>"

          if [ ! -f "$HEADER" ]; then
            echo "::error::找不到 $HEADER"
            exit 1
          fi

          if ! grep -Fq "$INCLUDE" "$HEADER"; then
            sed -i '/#include <godot_cpp\/variant\/callable_custom.hpp>/a #include <godot_cpp/variant/string_name.hpp>' "$HEADER"
          fi

          echo "检查头文件："
          grep -n 'godot_cpp/variant/.*hpp' "$HEADER"

      - name: Build Android ARM64 Editor Extension
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: android-arm64-editor
          cache-name: android-arm64-editor
          preset-name: android-arm64-editor

      - name: Verify compiled Android library
        shell: bash
        run: |
          set -euo pipefail

          LIBRARY="project/addons/orchestrator/liborchestrator.android.64.editor.so"

          if [ ! -f "$LIBRARY" ]; then
            echo "::error::没有找到 Android ARM64 Editor 动态库"
            find project -type f -name '*.so' -print || true
            exit 1
          fi

          echo "编译成功："
          ls -lh "$LIBRARY"
          file "$LIBRARY"

      - name: Upload Android ARM64 Editor library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor-Library
          path: project/addons/orchestrator/liborchestrator.android.64.editor.so
          if-no-files-found: error
          retention-days: 14
