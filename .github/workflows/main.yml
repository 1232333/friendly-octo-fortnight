
name: Build Android ARM64 Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit.zip -d "$RUNNER_TEMP/source"
          rsync -a "$RUNNER_TEMP/source/SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit/" ./

      - name: Fetch Godot dependencies
        run: |
          mkdir -p extern
          git clone --depth 1 --branch 4.7 https://github.com/godotengine/godot.git extern/godot-engine
          git clone --depth 1 --branch 4.7 https://github.com/godotengine/godot-cpp.git extern/godot-cpp

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Build Android ARM64 Editor
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: android-arm64-editor
          cache-name: android-arm64-editor
          preset-name: android-arm64-editor

      - name: Verify library
        run: |
          test -f project/addons/orchestrator/liborchestrator.android.64.editor.so

      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor
          path: project/addons/orchestrator/liborchestrator.android.64.editor.so
          
