
name: Build SkillTreeStudio Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-android-arm64-editor:
    name: Build Android ARM64 Editor
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # 1. 获取你的 GitHub 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 解压上传的构建包
      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::找不到构建包：$ZIP_FILE"
            ls -la
            exit 1
          fi

          TEMP_SOURCE="$RUNNER_TEMP/skill-tree-source"
          mkdir -p "$TEMP_SOURCE"

          unzip -q "$ZIP_FILE" -d "$TEMP_SOURCE"

          SOURCE_ROOT="$TEMP_SOURCE/SkillTreeStudio_Orchestrator_Android_ARM64_BuildKit"

          if [ ! -f "$SOURCE_ROOT/CMakeLists.txt" ]; then
            echo "::error::ZIP 内没有找到 CMakeLists.txt"
            find "$TEMP_SOURCE" -maxdepth 5 -name CMakeLists.txt -print
            exit 1
          fi

          rsync -a "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"

          echo "检查构建文件..."

          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f LICENSE
          test -f .github/actions/orchestrator-build/action.yml
          test -f project/addons/orchestrator/orchestrator.gdextension

          echo "源码准备完成。"

      # 3. 获取 godot-cpp
      - name: Fetch godot-cpp dependency
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: master
          path: extern/godot-cpp
          fetch-depth: 1

      # 4. 检查 godot-cpp
      - name: Verify godot-cpp
        shell: bash
        run: |
          set -euxo pipefail

          test -f extern/godot-cpp/SConstruct
          test -f extern/godot-cpp/CMakeLists.txt

          echo "godot-cpp commit:"
          git -C extern/godot-cpp log -1 --oneline

          echo "Orchestrator API version:"
          grep -n 'GODOTCPP_API_VERSION' CMakeLists.txt

      # 5. 安装编译工具
      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            ninja-build \
            ccache \
            rsync \
            unzip \
            file \
            jq

          cmake --version
          ninja --version
          clang++ --version

      # 6. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 7. 安装 SCons
      - name: Install SCons
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1

          python --version
          scons --version

      # 8. 安装 Android NDK
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      # 9. 设置并检查 NDK 环境变量
      - name: Configure Android NDK environment
        shell: bash
        run: |
          set -euo pipefail

          NDK_PATH="${ANDROID_NDK_HOME:-}"

          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK_ROOT:-}"
          fi

          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK:-}"
          fi

          if [ -z "$NDK_PATH" ]; then
            echo "::error::没有找到 Android NDK 路径"
            env | grep -i ndk || true
            exit 1
          fi

          if [ ! -f "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
            echo "::error::NDK 工具链文件不存在：$NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "NDK 路径：$NDK_PATH"
          ls "$NDK_PATH/build/cmake/android.toolchain.cmake"

      # 10. 检查 Android ARM64 构建配置
      - name: Verify Android build preset
        shell: bash
        run: |
          set -euo pipefail

          cmake --list-presets

          grep -n -A12 '"name": "android-arm64-editor"' \
            CMakePresets.json

          test -d project/addons/orchestrator

      # 11. 编译 Android ARM64 Editor
      - name: Build Android ARM64 Editor Extension
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: android-arm64-editor
          cache-name: android-arm64-editor
          preset-name: android-arm64-editor

      # 12. 检查编译产物
      - name: Verify compiled Android library
        shell: bash
        run: |
          set -euo pipefail

          LIBRARY="project/addons/orchestrator/liborchestrator.android.64.editor.so"

          echo "查找 Android 原生库..."

          if [ ! -f "$LIBRARY" ]; then
            echo "::error::没有找到 Android ARM64 Editor 库"

            echo "已生成的 so 文件："
            find project -type f -name '*.so' -print || true

            echo "构建目录："
            find build -maxdepth 4 -type f 2>/dev/null | head -100 || true

            exit 1
          fi

          echo "编译文件检查通过："
          ls -lh "$LIBRARY"
          file "$LIBRARY"

      # 13. 单独上传可下载的原生库
      - name: Upload Android ARM64 Editor library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor-Library
          path: project/addons/orchestrator/liborchestrator.android.64.editor.so
          if-no-files-found: error
          retention-days: 14

      # 14. 上传完整插件文件
      - name: Upload complete plugin
        uses: actions/upload-artifact@v4
        with:
          name: SkillTreeStudio-Orchestrator-Android-ARM64-Plugin
          path: |
            project/
          if-no-files-found: error
          retention-days: 14
