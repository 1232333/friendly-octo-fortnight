name: Android ARM64 Editor Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: android-arm64-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate Orchestrator project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "CMakeLists.txt" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "godot-orchestrator-2.5/CMakeLists.txt" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/godot-orchestrator-2.5"
          else
            CMAKE_FILE="$(find "$GITHUB_WORKSPACE" -name CMakeLists.txt \
              -not -path '*/.git/*' -not -path '*/extern/*' -print -quit)"
            if [ -z "$CMAKE_FILE" ]; then
              echo "::error::No CMakeLists.txt found. Make sure the Orchestrator source folder is committed."
              echo "Repository root contents:"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi
            PROJECT_DIR="$(dirname "$CMAKE_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/CMakePresets.json"
          test -f "$PROJECT_DIR/.gitmodules"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build ccache git

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install --upgrade pip scons==4.10.1

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Prepare Godot submodules
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extern

          if [ ! -f extern/godot-engine/CMakeLists.txt ]; then
            rm -rf extern/godot-engine
            git clone --depth 1 --branch master \
              https://github.com/godotengine/godot.git extern/godot-engine
          fi

          if [ ! -f extern/godot-cpp/CMakeLists.txt ]; then
            rm -rf extern/godot-cpp
            git clone --depth 1 --branch master \
              https://github.com/godotengine/godot-cpp.git extern/godot-cpp
          fi

      - name: Configure Android ARM64 Editor
        working-directory: ${{ env.PROJECT_DIR }}
        run: cmake --preset android-arm64-editor

      - name: Build Orchestrator
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          CACHE_FILE="$(find . -name CMakeCache.txt -not -path '*/extern/*' -print -quit)"
          if [ -z "$CACHE_FILE" ]; then
            echo "::error::CMakeCache.txt was not created by the configure step."
            exit 1
          fi
          BUILD_DIR="$(dirname "$CACHE_FILE")"
          echo "Building from: $BUILD_DIR"
          cmake --build "$BUILD_DIR" --target orchestrator -j 4

      - name: Verify output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          LIBRARY="project/addons/orchestrator/liborchestrator.android.64.editor.so"
          if [ ! -f "$LIBRARY" ]; then
            echo "::error::Build finished but output library was not found: $LIBRARY"
            find . -name 'liborchestrator*.so' -print
            exit 1
          fi
          ls -lh "$LIBRARY"

      - name: Upload Android ARM64 Editor Library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor-Library
          path: ${{ env.PROJECT_DIR }}/project/addons/orchestrator/liborchestrator.android.64.editor.so
          if-no-files-found: error
          retention-days: 7
