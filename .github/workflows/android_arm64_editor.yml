name: Android ARM64 Editor Build

on:
  workflow_dispatch:
  push:
    branches:
      - actions-trigger
    paths:
      - ".github/dispatch/build.txt"

permissions:
  contents: read

concurrency:
  group: android-arm64-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Extract Orchestrator source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/orchestrator-source"
          mkdir -p "$EXTRACT_DIR"

          ZIP_FILE=""
          while IFS= read -r -d '' candidate; do
            if unzip -Z1 "$candidate" | grep -Eq '(^|/)CMakeLists\.txt$'; then
              ZIP_FILE="$candidate"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print0)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP archive containing CMakeLists.txt was found in the repository."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using source archive: $(basename "$ZIP_FILE")"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          CMAKE_FILE="$(find "$EXTRACT_DIR" -name CMakeLists.txt \
            -not -path '*/extern/*' -print -quit)"
          if [ -z "$CMAKE_FILE" ]; then
            echo "::error::The ZIP was extracted, but no project CMakeLists.txt was found."
            find "$EXTRACT_DIR" -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$CMAKE_FILE")"
          if [ ! -f "$PROJECT_DIR/CMakePresets.json" ]; then
            echo "::error::CMakePresets.json is missing beside CMakeLists.txt: $PROJECT_DIR"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Orchestrator project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"


      - name: Install ASCII-only runtime localization bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/tools/localization/apply_runtime_loader.py" --root "$PROJECT_DIR"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build ccache git unzip fonts-noto-cjk

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install --upgrade pip scons==4.10.1 fonttools==4.63.0

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Fetch Godot dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extern

          if [ ! -f extern/godot-engine/CMakeLists.txt ]; then
            rm -rf extern/godot-engine
            git clone --depth 1 --branch master \
              https://github.com/godotengine/godot.git extern/godot-engine
          fi

          if [ ! -f extern/godot-cpp/CMakeLists.txt ]; then
            rm -rf extern/godot-cpp
            git clone --depth 1 --branch master \
              https://github.com/godotengine/godot-cpp.git extern/godot-cpp
          fi

      - name: Configure Android ARM64 Editor
        working-directory: ${{ env.PROJECT_DIR }}
        run: cmake --preset android-arm64-editor

      - name: Build Orchestrator
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          CACHE_FILE="$(find . -name CMakeCache.txt -not -path '*/extern/*' -print -quit)"
          if [ -z "$CACHE_FILE" ]; then
            echo "::error::CMakeCache.txt was not created by CMake configure."
            exit 1
          fi
          BUILD_DIR="$(dirname "$CACHE_FILE")"
          echo "Building from: $BUILD_DIR"
          cmake --build "$BUILD_DIR" --target orchestrator -j 4

      - name: Verify Android library
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          LIBRARY="project/addons/orchestrator/liborchestrator.android.64.editor.so"
          if [ ! -f "$LIBRARY" ]; then
            echo "::error::Expected library was not produced: $LIBRARY"
            find . -name 'liborchestrator*.so' -print
            exit 1
          fi
          ls -lh "$LIBRARY"

      - name: Prepare post-build Simplified Chinese translation resources
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/tools/localization/prepare_runtime_localization.py" \
            --root "$PROJECT_DIR" \
            --translations "$GITHUB_WORKSPACE/tools/localization/zh_CN.json" \
            --loader "$GITHUB_WORKSPACE/tools/localization/translation_loader.gd" \
            --regular /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            --bold /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc \
            --license /usr/share/doc/fonts-noto-cjk/copyright
          echo "Post-build translation and font assets:"
          find "$PROJECT_DIR/project/addons/orchestrator/locale" "$PROJECT_DIR/project/addons/orchestrator/fonts" -maxdepth 1 -type f -printf '%P %s bytes\n' | sort

      - name: Package complete Orchestrator Android plugin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ADDON_DIR="project/addons/orchestrator"
          if [ ! -d "$ADDON_DIR" ]; then
            echo "::error::Orchestrator addon directory is missing: $ADDON_DIR"
            exit 1
          fi
          echo "Addon directory structure (for packaging diagnosis):"
          find "$ADDON_DIR" -maxdepth 4 -type f -printf '%P\n' | sort | head -300
          echo "Editor plugin descriptors:"
          find "$ADDON_DIR" -maxdepth 4 -type f \( -name 'plugin.cfg' -o -name '*.gdextension' \) -print
          if [ ! -f "$ADDON_DIR/liborchestrator.android.64.editor.so" ]; then
            echo "::error::Android ARM64 editor library is missing from the addon directory."
            exit 1
          fi
          if [ ! -f "$ADDON_DIR/orchestrator.gdextension" ]; then
            echo "::error::GDExtension descriptor is missing."
            exit 1
          fi
          grep -F 'android.debug.arm64 = "res://addons/orchestrator/liborchestrator.android.64.editor.so"' "$ADDON_DIR/orchestrator.gdextension"
          test -s "$ADDON_DIR/fonts/NotoSansSC-Regular.otf"
          test -s "$ADDON_DIR/fonts/NotoSansSC-Bold.otf"
          test -s "$ADDON_DIR/locale/zh_CN.po"
          test -s "$ADDON_DIR/locale/translation_loader.gd"
          mkdir -p "$RUNNER_TEMP/orchestrator-plugin-package/addons"
          cp -a "$ADDON_DIR" "$RUNNER_TEMP/orchestrator-plugin-package/addons/orchestrator"
          (
            cd "$RUNNER_TEMP/orchestrator-plugin-package"
            zip -qr "$RUNNER_TEMP/Orchestrator-Android-ARM64-Editor-Plugin.zip" addons
          )
          echo "Packaged addon files:"
          find "$RUNNER_TEMP/orchestrator-plugin-package/addons/orchestrator" -type f | sort
          ls -lh "$RUNNER_TEMP/Orchestrator-Android-ARM64-Editor-Plugin.zip"

      - name: Upload complete Orchestrator Android plugin
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor-Plugin
          path: ${{ runner.temp }}/Orchestrator-Android-ARM64-Editor-Plugin.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android ARM64 Editor Library
        uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-Android-ARM64-Editor-Library
          path: ${{ env.PROJECT_DIR }}/project/addons/orchestrator/liborchestrator.android.64.editor.so
          if-no-files-found: error
          retention-days: 7
